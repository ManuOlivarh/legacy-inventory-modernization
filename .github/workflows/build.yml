name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The JDK version comes from .sdkmanrc, the same file local development uses.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .sdkmanrc
          cache: maven

      - name: Verify
        run: ./mvnw -B verify
