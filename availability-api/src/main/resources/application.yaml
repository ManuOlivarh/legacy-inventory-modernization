spring:
  application:
    name: availability-api
  datasource:
    url: jdbc:postgresql://localhost:5432/availability?socketTimeout=10
    username: availability
    password: Availability_2026!
    hikari:
      connection-timeout: 3000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    consumer:
      group-id: availability-api
      auto-offset-reset: earliest
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
    listener:
      concurrency: 3

availability:
  stock-levels-topic: inventory.stock-levels.v1
  dead-letter-topic: inventory.stock-levels.v1.availability-api.dlq

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
