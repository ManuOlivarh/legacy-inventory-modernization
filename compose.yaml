name: inventory

x-credentials: &credentials
  MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Legacy_Erp_Sa_2026!}
  DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:-Cdc_Reader_2026!}
  ERP_APP_PASSWORD: ${ERP_APP_PASSWORD:-Sim_Writer_2026!}

x-kafka: &kafka
  image: apache/kafka:${KAFKA_VERSION:-4.3.1}
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

x-kafka-env: &kafka-env
  CLUSTER_ID: 1Lzwa8PdR0mGNaB0slarOw
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m

services:
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092

  kafka-2:
    <<: *kafka
    hostname: kafka-2
    ports: ["9094:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9094

  kafka-3:
    <<: *kafka
    hostname: kafka-3
    ports: ["9095:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9095

  schema-registry:
    image: confluentinc/cp-schema-registry:${SCHEMA_REGISTRY_VERSION:-8.3.2}
    restart: unless-stopped
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms256m -Xmx256m
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/subjects', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:${SQLSERVER_VERSION:-2022-CU27-ubuntu-22.04}
    restart: unless-stopped
    ports: ["1433:1433"]
    environment:
      <<: *credentials
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      TZ: America/Guatemala
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_MEMORY_LIMIT_MB: 2048
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:${SQLSERVER_VERSION:-2022-CU27-ubuntu-22.04}
    depends_on:
      sqlserver: { condition: service_healthy }
    environment: *credentials
    volumes:
      - ./legacy-erp:/init:ro
    entrypoint: ["bash", "/init/init.sh"]
    restart: "no"

  connect:
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION:-3.6.2.Final}
    restart: unless-stopped
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      GROUP_ID: inventory-connect
      CONFIG_STORAGE_TOPIC: _connect-configs
      OFFSET_STORAGE_TOPIC: _connect-offsets
      STATUS_STORAGE_TOPIC: _connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3
      HEAP_OPTS: -Xms512m -Xmx768m
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:-Cdc_Reader_2026!}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  connect-init:
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION:-3.6.2.Final}
    depends_on:
      connect: { condition: service_healthy }
      sqlserver-init: { condition: service_completed_successfully }
    volumes:
      - ./connectors:/connectors:ro
    entrypoint:
      - bash
      - -c
      - >-
        curl -fsS -X PUT -H 'Content-Type: application/json'
        --data @/connectors/erp-cdc.json
        http://connect:8083/connectors/erp-cdc/config && echo
    restart: "no"

  kafka-init:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    volumes:
      - ./topics:/topics:ro
    entrypoint: ["bash", "/topics/create.sh"]
    restart: "no"

  schema-init:
    image: confluentinc/cp-schema-registry:${SCHEMA_REGISTRY_VERSION:-8.3.2}
    depends_on:
      schema-registry: { condition: service_healthy }
    volumes:
      - ./contracts:/contracts:ro
    entrypoint: ["python3", "/contracts/register.py", "http://schema-registry:8081"]
    restart: "no"

  inventory-translator:
    build:
      context: .
      dockerfile: inventory-translator/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      schema-init: { condition: service_completed_successfully }
      connect-init: { condition: service_completed_successfully }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75

  erp-simulator:
    build:
      context: .
      dockerfile: erp-simulator/Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver-init: { condition: service_completed_successfully }
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=ERPDB;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: erp_app
      SPRING_DATASOURCE_PASSWORD: ${ERP_APP_PASSWORD:-Sim_Writer_2026!}
      SIMULATOR_MOVEMENTS_PER_SECOND: ${SIMULATOR_MOVEMENTS_PER_SECOND:-5}

  availability-db:
    image: postgres:${POSTGRES_VERSION:-18.1-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: availability
      POSTGRES_USER: availability
      POSTGRES_PASSWORD: ${AVAILABILITY_DB_PASSWORD:-Availability_2026!}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U availability -d availability"]
      interval: 5s
      timeout: 5s
      retries: 12

  availability-api:
    build:
      context: .
      dockerfile: availability-api/Dockerfile
    restart: unless-stopped
    depends_on:
      availability-db: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      schema-init: { condition: service_completed_successfully }
    ports: ["8080:8080"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://availability-db:5432/availability?socketTimeout=10
      SPRING_DATASOURCE_USERNAME: availability
      SPRING_DATASOURCE_PASSWORD: ${AVAILABILITY_DB_PASSWORD:-Availability_2026!}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
