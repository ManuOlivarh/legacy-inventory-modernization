# Local environment for the whole system. Docker with Compose v2 is the only
# requirement. Image tags are pinned here; override any variable in a local .env.
#
# Credentials below are development defaults for a disposable local stack.

name: inventory

x-credentials: &credentials
  MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Legacy_Erp_Sa_2026!}
  DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:-Cdc_Reader_2026!}
  ERP_APP_PASSWORD: ${ERP_APP_PASSWORD:-Sim_Writer_2026!}

# Three combined broker+controller nodes: the minimum for replication factor 3
# with min.insync.replicas=2, so losing one broker is survivable (scenario F1).
x-kafka: &kafka
  image: apache/kafka:${KAFKA_VERSION:-4.3.1}
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

x-kafka-env: &kafka-env
  CLUSTER_ID: 1Lzwa8PdR0mGNaB0slarOw
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  # Topics are created deliberately, with explicit settings, never by a typo.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m

services:
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092

  kafka-2:
    <<: *kafka
    hostname: kafka-2
    ports: ["9094:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9094

  kafka-3:
    <<: *kafka
    hostname: kafka-3
    ports: ["9095:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9095

  schema-registry:
    image: confluentinc/cp-schema-registry:${SCHEMA_REGISTRY_VERSION:-8.3.2}
    restart: unless-stopped
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms256m -Xmx256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  sqlserver:
    # x86-64 only; runs under emulation on Apple Silicon (see README).
    image: mcr.microsoft.com/mssql/server:${SQLSERVER_VERSION:-2022-CU27-ubuntu-22.04}
    restart: unless-stopped
    ports: ["1433:1433"]
    environment:
      <<: *credentials
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: "true"   # CDC capture jobs run on SQL Server Agent
      MSSQL_MEMORY_LIMIT_MB: 2048
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot: creates the legacy schema, seed data, CDC and logins.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:${SQLSERVER_VERSION:-2022-CU27-ubuntu-22.04}
    depends_on:
      sqlserver: { condition: service_healthy }
    environment: *credentials
    volumes:
      - ./legacy-erp:/init:ro
    # Invoked through bash so the script needs no executable bit (Windows checkouts).
    entrypoint: ["bash", "/init/init.sh"]
    restart: "no"

  connect:
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION:-3.6.2.Final}
    restart: unless-stopped
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      GROUP_ID: inventory-connect
      CONFIG_STORAGE_TOPIC: _connect-configs
      OFFSET_STORAGE_TOPIC: _connect-offsets
      STATUS_STORAGE_TOPIC: _connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3
      HEAP_OPTS: -Xms512m -Xmx768m
      # Connector configs reference ${env:...} instead of embedding secrets.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:-Cdc_Reader_2026!}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # One-shot: registers (or updates) the CDC connector. PUT is idempotent.
  connect-init:
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION:-3.6.2.Final}
    depends_on:
      connect: { condition: service_healthy }
      sqlserver-init: { condition: service_completed_successfully }
    volumes:
      - ./connectors:/connectors:ro
    entrypoint:
      - bash
      - -c
      - >-
        curl -fsS -X PUT -H 'Content-Type: application/json'
        --data @/connectors/erp-cdc.json
        http://connect:8083/connectors/erp-cdc/config && echo
    restart: "no"

  erp-simulator:
    build:
      context: .
      dockerfile: erp-simulator/Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver-init: { condition: service_completed_successfully }
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=ERPDB;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: erp_app
      SPRING_DATASOURCE_PASSWORD: ${ERP_APP_PASSWORD:-Sim_Writer_2026!}
      SIMULATOR_MOVEMENTS_PER_SECOND: ${SIMULATOR_MOVEMENTS_PER_SECOND:-5}
